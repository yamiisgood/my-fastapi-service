<!DOCTYPE html>

<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Agent Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎯 Valorant Agent Finder</h1>
        <p>A website powered by a REST API</p>
    </header>
    <main>
        <section class="search">
            <input type="text" id="searchInput" placeholder="Search for an agent...">
            <button onclick="searchAgents()"> Search </button>
            <button class="secondary" onclick="loadAgents()"> Show All </button>
        </section>

        <section>
            <h2>Agents</h2>
            <div id="agentList" class="agent-list">
                Loading agents...
            </div>
        </section>
    </main>

    <footer>
        <p>Data provided by the Valorant Agents API</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
