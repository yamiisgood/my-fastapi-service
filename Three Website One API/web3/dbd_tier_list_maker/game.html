<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DBDle game">
    <title>DBDle - Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

    <header class="topbar">
        <a href="index.html" class="brand">
            <span class="dbd-logo">
                DEAD BY<br>
                DAYLIGHT <span class="scratch">|||||</span>
            </span>

            <span class="brand-divider"></span>
            <span class="brand-title">DBDLE</span>
        </a>

        <nav>
            <a href="index.html">HOME</a>
            <a href="index.html#modes">CHANGE MODE</a>
        </nav>
    </header>


    <main class="game-main">

        <section class="game-intro">

            <div>

                <p id="modeEyebrow" class="eyebrow">
                    CLASSIC MODE
                </p>

                <h1 id="gameModeTitle">
                    MIXED MODE
                </h1>

                <p id="modeDescription">
                    Survivors and Killers are both included.
                </p>

            </div>


            <div class="attempt-card">
                <span>ATTEMPTS</span>
                <strong id="attemptCount">0</strong>
            </div>

        </section>


        <section class="game-panel">

            <div class="guess-area">

                <form id="guessForm" class="guess-form">

                    <input
                        id="guessInput"
                        list="characterNames"
                        type="text"
                        placeholder="TYPE A CHARACTER NAME..."
                        autocomplete="off"
                        required
                    >

                    <datalist id="characterNames"></datalist>

                    <button type="submit">
                        GUESS
                    </button>

                </form>


                <button id="giveUpBtn" class="give-up-btn">
                    GIVE UP
                </button>

            </div>


            <div class="legend-panel">

                <div>
                    <span class="legend-color correct"></span>
                    <p>CORRECT</p>
                </div>

                <div>
                    <span class="legend-color partial"></span>
                    <p>PARTIAL</p>
                </div>

                <div>
                    <span class="legend-color wrong"></span>
                    <p>INCORRECT</p>
                </div>

                <div>
                    <span class="legend-arrow">↑</span>
                    <p>TARGET HIGHER</p>
                </div>

                <div>
                    <span class="legend-arrow">↓</span>
                    <p>TARGET LOWER</p>
                </div>

            </div>


            <div class="table-scroll">

                <div class="guess-table">

                    <div class="guess-header">

                        <div>CHARACTER</div>
                        <div>ROLE</div>
                        <div>GENDER</div>
                        <div>ORIGIN</div>
                        <div>REALM</div>
                        <div>DLC</div>
                        <div>YEAR</div>
                        <div>DIFFICULTY</div>

                    </div>


                    <div id="guessRows" class="guess-rows"></div>

                </div>

            </div>


            <div id="resultPanel" class="result-modal hidden">

                <div class="result-backdrop"></div>

                <article class="result-card">

                    <button id="closeResultBtn" class="result-close" aria-label="Close result">
                        ×
                    </button>

                    <p id="resultEyebrow" class="result-eyebrow">
                        YOU FOUND THEM
                    </p>

                    <div class="result-image-wrap">
                        <img id="resultImage" src="" alt="Character">
                    </div>

                    <p class="result-small-label">
                        THE CHARACTER WAS
                    </p>

                    <h2 id="resultName"></h2>

                    <p id="resultInfo" class="result-info"></p>

                    <div class="result-actions">

                        <button id="playAgainBtn">
                            PLAY AGAIN
                        </button>

                        <a href="index.html#modes">
                            CHANGE MODE
                        </a>

                    </div>

                </article>

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
